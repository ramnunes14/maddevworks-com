<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <title>MadDevWorks — Portfolio Links</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Acede rapidamente aos websites lançados pela MadDevWorks. Um hub ao estilo Linktree com os projetos que já colocámos no ar."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="../assets/css/novo.css" as="style" />
    <link rel="stylesheet" href="../assets/css/novo.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://kit.fontawesome.com/9159835a96.js" crossorigin="anonymous"></script>
    <link rel="icon" href="../assets/images/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/images/favicon.png" />
  </head>
  <body>
    <div class="shell shell--links">
      <main class="links-page" id="links">
        <section class="linktree" aria-labelledby="linktree-heading">
          <div class="linktree__card">
            <div class="linktree__logo">
              <img
                src="../assets/images/logo_header.png"
                alt="MadDevWorks"
                width="120"
                height="120"
                loading="lazy"
              />
            </div>
            <h1 id="linktree-heading">Nosso Portfólio</h1>
            <p class="linktree__subtitle">
              Acesso direto aos sites que já estão no ar — agora num só lugar.
            </p>

            <div class="linktree__list" aria-label="Links para os sites já lançados">
              <a
                class="linktree__link"
                href="https://carvaogrillhouse.com"
                target="_blank"
                rel="noreferrer"
              >
                <span>Carvão Grill House</span>
                <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
              </a>

              <a
                class="linktree__link"
                href="https://sublimeshuttle.com"
                target="_blank"
                rel="noreferrer"
              >
                <span>Sublime Shuttle</span>
                <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
              </a>

              <a
                class="linktree__link "
                href="https://restaurantextonel.com"
                target="_blank"
                rel="noreferrer"
              >
                <span>Restaurante X-Tonel</span>
                <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
              </a>

              <a class="linktree__link linktree__link--solid" href="mailto:maddevworks@gmail.com">
                <span>Falar com a equipa</span>
                <i class="fa-regular fa-envelope" aria-hidden="true"></i>
              </a>
            </div>

            <div class="linktree__social" aria-label="Canais sociais">
              <a href="https://www.instagram.com" aria-label="Instagram" target="_blank" rel="noreferrer">
                <i class="fa-brands fa-instagram" aria-hidden="true"></i>
              </a>
              <a href="https://www.facebook.com" aria-label="Facebook" target="_blank" rel="noreferrer">
                <i class="fa-brands fa-facebook" aria-hidden="true"></i>
              </a>
              <a href="https://wa.me/351925523887" aria-label="WhatsApp" target="_blank" rel="noreferrer">
                <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
              </a>
            </div>

            
          </div>
        </section>
      </main>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
